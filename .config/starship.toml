# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Don't space each prompt with a new line
add_newline = false

# A minimal left prompt
format = """
$directory\
$git_branch\
$git_status\
$character"""
# format = """$python$directory$git_branch${custom.git_status_dirty}$git_status$character"""

# move the rest of the prompt to the right
right_format = """$cmd_duration"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "blue"
truncation_length = 1
truncation_symbol = ""
fish_style_pwd_dir_length = 1
truncate_to_repo = true

[git_branch]
style = "green bold"
format = '[$branch]($style) '

[git_status]
style = "yellow bold"
format = "[$ahead_behind$staged$modified$untracked$renamed$deleted]($style)"
# ahead = "⇡${count}"
# behind = "⇣${count}"
staged = "●${count}"
modified = "✚${count}"
untracked = "*${count}"
# renamed = "◫${count}"
# deleted = "✖${count}"

[cmd_duration]
min_time = 0
format = "[$duration]($style)"
style = "text"
